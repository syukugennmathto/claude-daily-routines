<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メディア取得">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>メディア取得</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>メディア取得</h1><a href="/admin">管理</a></header>
<main>
  <div id="banners"></div>
  <form class="card" id="url-form">
    <input type="url" id="url" inputmode="url" placeholder="動画のURLを貼り付け" autocomplete="off" required aria-label="動画のURL">
    <div class="actions">
      <button class="primary grow" type="submit" id="check">確認</button>
      <button type="button" id="paste">貼り付け</button>
    </div>
    <label class="row muted"><input type="checkbox" id="playlist-all"> プレイリストは全件取得する（最大20件）</label>
  </form>
  <div id="preview"></div>
  <section>
    <div id="jobs"></div>
    <p class="muted center" id="empty">ジョブはまだありません。</p>
  </section>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
