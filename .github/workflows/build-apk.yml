name: Build APK

# このブランチに変更が入るたび、または手動実行で APK を組み立てて
# Release にアップロードします（スマホから直接ダウンロードできるように）。
on:
  push:
    branches: [ "claude/android-youtube-blocker-9rpu4l" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a Release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: YouTube Blocker (latest build)
          body: |
            スマホでこのページの `app-debug.apk` をタップしてインストールしてください。
            （初回は「不明なアプリのインストール」を許可する必要があります）
          files: app/build/outputs/apk/debug/app-debug.apk
